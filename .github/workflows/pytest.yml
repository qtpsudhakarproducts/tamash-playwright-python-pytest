name: Pytest Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  test:
    name: Self-healing tests (${{ matrix.provider }})
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      # Each provider gets its own full test run — a broken provider (bad token, rate limit,
      # SDK-side outage) shouldn't hide the other's result, so this deliberately doesn't stop the
      # matrix early.
      fail-fast: false
      # APP_BASE_URL points at one shared *live* external demo app, not a disposable per-job
      # instance — confirmed via a real CI failure that running legs in parallel lets two of them
      # create an employee at the same moment and collide on OrangeHRM's server-assigned Employee
      # Id ("Employee Id already exists"), failing test_pomtest.py for reasons that have nothing
      # to do with the provider under test. Serialize the matrix so only one leg touches the
      # shared app's state at a time — slower, but deterministic.
      max-parallel: 1
      # One API-key provider (ollama — this project's own established free-tier CI convention,
      # already used in tamash-playwright's own pipeline, no cost/rate-limit surprises seen) and
      # one subscription provider (claude-subscription, the more mature of the two) is enough to
      # validate tamash-playwright itself works end to end in a real project. Per-vendor response
      # parsing for every other provider (openai/anthropic/gemini/copilot-subscription) is already
      # covered by tamash-playwright's own unit tests and live doctor checks — exercising all of
      # them here too just adds vendor-specific noise (e.g. a rate-limited free-tier key) without
      # testing anything project-specific. All 6 passed at least once during this pin's
      # validation; see git history on this file to bring one back if ever needed.
      matrix:
        provider: [ollama, claude-subscription]
    env:
      HEALER_ENABLED: "true"
      HEALER_PROVIDER: ${{ matrix.provider }}
      APP_BASE_URL: "https://qtpsudhakar-vibetestq-hrm.up.railway.app/"
      # Ollama Cloud — plain API key, no extra setup needed.
      OLLAMA_MODEL: "gpt-oss:120b"
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      # claude-agent-sdk's own documented CI auth path (see `claude setup-token`) — takes the
      # place of an interactive `claude login`.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: pip install -e .

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Install claude-agent-sdk
        if: matrix.provider == 'claude-subscription'
        run: pip install claude-agent-sdk

      - name: Install the native Claude Code CLI
        if: matrix.provider == 'claude-subscription'
        # claude-agent-sdk refuses to run the npm-installed `claude.cmd` shim, but that's a
        # Windows-only guard (see the main package's README "Known limitations") — on Linux, npm
        # produces a real executable, so this is the standard install path with no workaround
        # needed. Ubuntu runners ship Node.js already.
        run: npm install -g @anthropic-ai/claude-code

      - name: Run pytest
        run: pytest -v --tamash-report=tamash-report.html

      - name: Upload self-healing report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tamash-report-${{ matrix.provider }}
          path: tamash-report.html
          if-no-files-found: ignore

      - name: Upload pytest-html report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.provider }}
          path: report.html
          if-no-files-found: ignore
