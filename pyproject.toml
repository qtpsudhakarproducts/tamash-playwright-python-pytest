[project]
name = "tamash-playwright-python-pytest"
version = "1.0.0"
description = "Example usage of tamash-playwright with pytest, with and without the Page Object Model."
requires-python = ">=3.9"
dependencies = [
    "pytest>=8.0.0",
    "pytest-playwright>=0.5.0",
    "pytest-html>=4.1.0",
    "tamash-playwright>=0.4.0",
    "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
addopts = "--html=report.html --self-contained-html --tamash-report=tamash-report.html"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
