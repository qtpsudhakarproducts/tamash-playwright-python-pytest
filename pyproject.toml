[project]
name = "tamash-playwright-python-pytest"
version = "1.0.0"
description = "Example usage of tamash-playwright with pytest, with and without the Page Object Model."
requires-python = ">=3.9"
dependencies = [
    "pytest>=8.0.0",
    "pytest-playwright>=0.5.0",
    "pytest-html>=4.1.0",
    # Pinned to the exact beta under test — a bare ">=0.2.0" would resolve to the latest STABLE
    # release (0.2.0), never a pre-release, since pip excludes pre-releases from a plain version
    # range unless the range itself names one. Bump this pin (or relax back to a stable ">=")
    # once 0.3.0 ships as a real release.
    "tamash-playwright==0.3.0b1",
    "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
addopts = "--html=report.html --self-contained-html"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
